      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#9fb4ff';
      ctx.fillRect(px, py, s.r, s.r);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  drawTerrain(ctx, bounds) {
    const chunks = this.worldgen.visibleChunks(bounds);
    ctx.imageSmoothingEnabled = false;
    for (const c of chunks) {
      if (!c.canvas) continue;
      ctx.drawImage(c.canvas, c.ox, c.oy, CHUNK, CHUNK);
    }
    ctx.imageSmoothingEnabled = true;
  }

  /** A single offset silhouette pass gives the whole scene depth cheaply. */
  drawShadows(ctx, bounds) {
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = '#000';
    ctx.translate(6, 9);
    for (const b of this.physics.bodies) {
      if (b.dead || b.aabb.maxX < bounds.minX || b.aabb.minX > bounds.maxX) continue;
      if (b.aabb.maxY < bounds.minY || b.aabb.minY > bounds.maxY) continue;
      for (const p of b.parts) {
        ctx.beginPath();
        const v = p.worldVerts;
        ctx.moveTo(v[0].x, v[0].y);
        for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.restore();
  }

  drawBodies(ctx, bounds) {
    const glows = [];
    for (const b of this.physics.bodies) {
      if (b.dead) continue;
      if (b.aabb.maxX < bounds.minX || b.aabb.minX > bounds.maxX) continue;
      if (b.aabb.maxY < bounds.minY || b.aabb.minY > bounds.maxY) continue;
      this.drawBody(ctx, b, glows);
    }

    // Additive glow pass last, so nothing draws over the light.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const g of glows) {
      ctx.globalAlpha = g.a;
      const s = g.r * 2;
      ctx.drawImage(this.glowSprite, g.x - g.r, g.y - g.r, s, s);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  drawBody(ctx, body, glows) {
    const hue = body.hueShift || 0;
    const falling = body.falling || 0;

    if (falling > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(1 - falling, 0, 1);
      ctx.translate(body.pos.x, body.pos.y);
      const s = clamp(1 - falling * 0.75, 0.05, 1);
      ctx.scale(s, s);
      ctx.translate(-body.pos.x, -body.pos.y);
    }

    for (const p of body.parts) {
      const def = p.def;
      const v = p.worldVerts;
      const wear = clamp(p.hp / p.maxHp, 0, 1);

      ctx.beginPath();
      ctx.moveTo(v[0].x, v[0].y);
      for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
      ctx.closePath();

      let fill = tint(def.color, hue);
      if (p.flash > 0.02) {
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.globalAlpha = clamp(p.flash, 0, 1) * 0.9;
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = fill;
        ctx.fill();
        // Damage reads as the part going dark and dead.
        if (wear < 0.98) {
          ctx.globalAlpha = (1 - wear) * 0.55;
          ctx.fillStyle = '#0b0d14';
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      ctx.lineWidth = 2;
      ctx.strokeStyle = wear < 0.35 ? '#ff5a5a' : tint(def.accent, hue);
      ctx.stroke();

      // Actuator tells: a firing thruster, a hot blade, a charged cannon.
      if (def.kind === 'thruster' && p.activation > 0.05) {
        this.drawFlame(ctx, p);
      }
      if (def.glow > 0 || p.heat > 0.05) {
        glows.push({
          x: p.wpos.x, y: p.wpos.y,
          r: def.reach * (1.5 + p.heat * 1.4),
          a: clamp(def.glow * 0.5 + p.heat * 0.5, 0, 1) * (0.35 + wear * 0.4),
        });
      }
      if (def.kind === 'blade' && p.heat > 0.1) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = p.heat * 0.7;
        ctx.strokeStyle = def.accent;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      }
    }

    this.drawWeldStress(ctx, body);

    if (falling > 0) ctx.restore();

    if ((body.tag === 'enemy' || body.showBar) && body.parts.length) {
      this.drawIntegrityBar(ctx, body);
    }
  }

  drawFlame(ctx, part) {
    const a = part.wangle;
    const back = a + Math.PI;
    const len = (10 + part.activation * 30) * (0.75 + Math.random() * 0.5);
    const w = 6 + part.activation * 4;
    const ox = part.wpos.x + Math.cos(back) * (part.def.extents.x + 1);
    const oy = part.wpos.y + Math.sin(back) * (part.def.extents.x + 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.moveTo(ox + Math.cos(back + 1.57) * w * 0.5, oy + Math.sin(back + 1.57) * w * 0.5);
    ctx.lineTo(ox + Math.cos(back) * len, oy + Math.sin(back) * len);
    ctx.lineTo(ox + Math.cos(back - 1.57) * w * 0.5, oy + Math.sin(back - 1.57) * w * 0.5);
    ctx.closePath();
    ctx.fillStyle = part.activation > 0.7 ? '#9fe8ff' : '#c9a8ff';
    ctx.globalAlpha = 0.65 + part.activation * 0.35;
    ctx.fill();
    ctx.restore();
  }

  /**
   * Stressed welds are drawn as glowing seams that redden as they fail. This is
   * the player's only warning that a wing is about to come off -- and their cue
   * that an enemy is one good hit from losing its gun arm.
   */
  drawWeldStress(ctx, body) {
    if (body.welds.length === 0) return;
    ctx.save();
    ctx.lineCap = 'round';
    for (const w of body.welds) {
      const ratio = w.hp / w.maxHp;
      if (ratio > 0.8) continue;
      const a = body.getPart(w.a), b = body.getPart(w.b);
      if (!a || !b) continue;
      const t = clamp(1 - ratio, 0, 1);
      ctx.globalAlpha = clamp(t * 1.1, 0, 0.95);
      ctx.strokeStyle = ratio < 0.35 ? '#ff3b3b' : '#ffb547';
      ctx.lineWidth = 1.5 + t * 2.5;
      ctx.beginPath();
      ctx.moveTo(a.wpos.x, a.wpos.y);
      ctx.lineTo(b.wpos.x, b.wpos.y);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  drawIntegrityBar(ctx, body) {
    const w = clamp(body.radius * 1.8, 34, 150);
    const x = body.pos.x - w / 2;
    const y = body.aabb.minY - 14;
    const v = clamp(body.integrity, 0, 1);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#11141f';
    ctx.fillRect(x - 1, y - 1, w + 2, 6);
    ctx.fillStyle = v > 0.5 ? '#7de08a' : v > 0.25 ? '#ffc857' : '#ff5a5a';
    ctx.fillRect(x, y, w * v, 4);
    ctx.globalAlpha = 1;
    if (body.bossName) {
      ctx.font = '600 12px ui-monospace, monospace';
      ctx.fillStyle = '#ffd0d0';
      ctx.textAlign = 'center';
      ctx.fillText(body.bossName, body.pos.x, y - 6);
      ctx.textAlign = 'left';
    }
  }

  drawPickups(ctx) {
    const t = this.game.time;
    for (const p of this.game.pickups) {
      const def = PARTS[p.partId];
      const bob = Math.sin(t * 3 + p.phase) * 3;
      ctx.save();
      ctx.translate(p.x, p.y + bob);
      ctx.rotate(t * 0.8 + p.phase);
      ctx.scale(0.62, 0.62);
      ctx.beginPath();
      const v = def.verts;
      ctx.moveTo(v[0].x, v[0].y);
      for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
      ctx.closePath();
      ctx.fillStyle = def.color;
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = def.accent;
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.35 + Math.sin(t * 5 + p.phase) * 0.12;
      const r = 26;
      ctx.drawImage(this.glowSprite, p.x - r, p.y + bob - r, r * 2, r * 2);
      ctx.restore();
    }
  }

  drawProjectiles(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const p of this.game.projectiles.list) {
      const d = p.def;
      // Motion-stretched trail: the faster it moves, the longer it reads.
      ctx.strokeStyle = d.trail;
      ctx.globalAlpha = 0.8;
      ctx.lineWidth = d.radius * 1.6;
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();

      ctx.fillStyle = d.color;
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, d.radius, 0, TAU);
      ctx.fill();

      ctx.globalAlpha = 0.5;
      ctx.drawImage(this.glowSprite, p.x - d.glow, p.y - d.glow, d.glow * 2, d.glow * 2);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  drawParticles(ctx) {
    const pool = this.fx.pool;

    // Non-additive pass: debris chunks, smoke, floating text.
    for (const p of pool) {
      if (!p.active || p.glow) continue;
      const t = p.life / p.maxLife;
      if (p.type === 'debris') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.scale(p.size, p.size);
        ctx.globalAlpha = clamp(t * 1.4, 0, 1);
        ctx.beginPath();
        const v = p.verts;
        ctx.moveTo(v[0].x, v[0].y);
        for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
        ctx.closePath();
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
      } else if (p.type === 'smoke') {
        ctx.globalAlpha = clamp(t, 0, 1) * 0.35;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      } else if (p.type === 'text') {
        ctx.globalAlpha = clamp(t * 1.6, 0, 1);
        ctx.font = '700 15px ui-monospace, monospace';
        ctx.fillStyle = p.color;
        ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
        ctx.textAlign = 'left';
      }
    }
    ctx.globalAlpha = 1;

    // Additive pass: sparks, rings, flashes.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const p of pool) {
      if (!p.active || !p.glow) continue;
      const t = clamp(p.life / p.maxLife, 0, 1);
      if (p.type === 'spark') {
        ctx.globalAlpha = t;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02);
        ctx.stroke();
      } else if (p.type === 'ring') {
        const grow = 1 - t;
        ctx.globalAlpha = t * 0.75;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2 + t * 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.25 + grow), 0, TAU);
        ctx.stroke();
      } else if (p.type === 'flash') {
        ctx.globalAlpha = t;
        ctx.drawImage(this.glowSprite, p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /** Build mode: the snap ghost, the host highlight, and the grid. */
  drawBuildOverlay(ctx) {
    const g = this.game;
    const preview = g.buildPreview;

    ctx.save();
    ctx.globalAlpha = 0.14;
    ctx.strokeStyle = '#7de8ff';
    ctx.lineWidth = 1;
    const b = this.camera.viewBounds(0);
    const step = GRID;
    ctx.beginPath();
    for (let x = Math.floor(b.minX / step) * step; x < b.maxX; x += step) {
      ctx.moveTo(x, b.minY); ctx.lineTo(x, b.maxY);
    }
    for (let y = Math.floor(b.minY / step) * step; y < b.maxY; y += step) {
      ctx.moveTo(b.minX, y); ctx.lineTo(b.maxX, y);
    }
    ctx.stroke();
    ctx.restore();

    if (g.buildTargetBody) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#7de8ff';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      const a = g.buildTargetBody.aabb;
      ctx.strokeRect(a.minX - 6, a.minY - 6, a.maxX - a.minX + 12, a.maxY - a.minY + 12);
      ctx.restore();
    }

    if (g.hoverPart) {
      ctx.save();
      ctx.globalAlpha = 0.8;
      ctx.strokeStyle = '#ff5a7a';
      ctx.lineWidth = 3;
      const v = g.hoverPart.worldVerts;
      ctx.beginPath();
      ctx.moveTo(v[0].x, v[0].y);
      for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    if (preview) {
      const def = preview.def;
      ctx.save();
      ctx.translate(preview.world.x, preview.world.y);
      ctx.rotate(preview.worldAngle);
      ctx.beginPath();
      const v = def.verts;
      ctx.moveTo(v[0].x, v[0].y);
      for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
      ctx.closePath();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = preview.valid ? def.color : '#ff3b5c';
      ctx.fill();
      ctx.globalAlpha = 0.95;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = preview.valid ? '#9fffe0' : '#ff3b5c';
      ctx.stroke();
      ctx.restore();
    }
  }

  /** Aim reticle plus a soft lock indicator on whatever is under the cursor. */
  drawTargeting(ctx) {
    const g = this.game;
    if (!g.player || g.player.dead) return;
    const a = g.aimWorld;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = g.buildMode ? '#7de8ff' : '#ffd27a';
    ctx.lineWidth = 1.6;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(a.x, a.y, 9, 0, TAU);
    ctx.moveTo(a.x - 15, a.y); ctx.lineTo(a.x - 5, a.y);
    ctx.moveTo(a.x + 5, a.y); ctx.lineTo(a.x + 15, a.y);
    ctx.moveTo(a.x, a.y - 15); ctx.lineTo(a.x, a.y - 5);
    ctx.moveTo(a.x, a.y + 5); ctx.lineTo(a.x, a.y + 15);
    ctx.stroke();
    ctx.restore();
  }

  drawPostEffects(ctx, W, H) {
    const j = this.juice;

    if (j.flashAmount > 0.005) {
      ctx.save();
      ctx.globalAlpha = j.flashAmount * 0.55;
      ctx.fillStyle = j.flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // Vignette: always a touch, heavier as the player's chassis fails.
    const hurt = this.game.player && !this.game.player.dead
      ? clamp(1 - this.game.player.integrity, 0, 1) : 0.65;
    const grad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.72);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, `rgba(${hurt > 0.5 ? '60,0,10' : '0,0,0'},${0.45 + hurt * 0.35})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    if (j.frozen) {
      // A single scanline tick during hitstop -- subliminal, but you feel it.
      ctx.globalAlpha = 0.06;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }
}


// ===== src/ui/hud.js =====
const FONT = 'ui-monospace, SFMono-Regular, Menlo, monospace';

/**
 * Screen-space HUD. Everything here answers a question the player asks under
 * pressure: how broken am I, what can I still build, and where is the fight.
 */
class HUD {
  constructor(game) {
    this.game = game;
    this.minimap = document.createElement('canvas');
    this.minimap.width = this.minimap.height = 168;
    this.minimapTimer = 0;
    this.minimapOrigin = { x: 0, y: 0 };
    this.toast = null;
    this.toastTime = 0;
  }

  say(text, seconds = 2.6) {
    this.toast = text;
    this.toastTime = seconds;
  }

  update(dt) {
    if (this.toastTime > 0) this.toastTime -= dt;
    this.minimapTimer -= dt;
    if (this.minimapTimer <= 0) {
      this.minimapTimer = 0.5;
      this.paintMinimap();
    }
  }

  /** Terrain layer of the minimap, repainted twice a second. */
  paintMinimap() {
    const g = this.minimap.getContext('2d');
    const S = this.minimap.width;
    const range = 2200;
    const samples = 42;
    const step = (range * 2) / samples;
    const px = S / samples;
    const p = this.game.player;
    const cx = p && !p.dead ? p.pos.x : this.game.camera.x;
    const cy = p && !p.dead ? p.pos.y : this.game.camera.y;
    this.minimapOrigin = { x: cx, y: cy, range };

    g.clearRect(0, 0, S, S);
    g.fillStyle = '#080a12';
    g.fillRect(0, 0, S, S);
    for (let i = 0; i < samples; i++) {
      for (let j = 0; j < samples; j++) {
        const wx = cx - range + i * step;
        const wy = cy - range + j * step;
        if (!this.game.worldgen.isSolid(wx, wy)) continue;
        const b = this.game.worldgen.biomeAt(wx, wy);
        g.fillStyle = `rgb(${b.ground[0]},${b.ground[1]},${b.ground[2]})`;
        g.fillRect(i * px, j * px, px + 1, px + 1);
      }
    }
  }

  draw(ctx, W, H) {
    const g = this.game;
    ctx.save();
    ctx.textBaseline = 'top';

    this.drawStatus(ctx, W, H);
    this.drawHotbar(ctx, W, H);
    this.drawMinimap(ctx, W, H);
    if (g.buildMode) this.drawBuildPanel(ctx, W, H);
    this.drawToast(ctx, W, H);
    if (g.player && g.player.dead) this.drawDeath(ctx, W, H);
    if (!g.started) this.drawTitle(ctx, W, H);

    ctx.restore();
  }

  bar(ctx, x, y, w, h, value, color, bg = 'rgba(8,10,18,0.75)') {
    ctx.fillStyle = bg;
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * clamp(value, 0, 1), h);
  }

  drawStatus(ctx, W, H) {
    const g = this.game;
    const p = g.player;
    const x = 20, y = 20;

    ctx.font = `600 12px ${FONT}`;
    ctx.fillStyle = '#8ea3c9';
    ctx.fillText('STRUCTURAL INTEGRITY', x, y);

    const integrity = p && !p.dead ? p.integrity : 0;
    this.bar(ctx, x, y + 16, 230, 12, integrity,
      integrity > 0.5 ? '#7de08a' : integrity > 0.25 ? '#ffc857' : '#ff5a5a');

    ctx.fillStyle = '#8ea3c9';
    ctx.fillText('ENERGY', x, y + 40);
    const energy = p && p.energyMax > 0 ? p.energy / p.energyMax : 0;
    this.bar(ctx, x, y + 56, 230, 8, energy, g.brownout > 0.15 ? '#ff8a3d' : '#39e6ff');

    ctx.font = `500 11px ${FONT}`;
    const parts = p && !p.dead ? p.parts.length : 0;
    const mass = p && !p.dead ? p.mass.toFixed(1) : '0.0';
    // Draw vs supply is the number that decides a build. Showing it live is
    // what turns "why is my machine sluggish" into "I need another battery".
    const draw = Math.round(g.lastDemand || 0);
    const supply = Math.round(g.lastSupply || 0);
    ctx.fillStyle = draw > supply ? '#ff8a3d' : '#5f6f8f';
    ctx.fillText(`DRAW ${draw}/${supply}`, x + 152, y + 72);
    ctx.fillStyle = '#5f6f8f';
    ctx.fillText(`PARTS ${parts}   MASS ${mass}`, x, y + 72);
    ctx.fillText(g.biomeLabel.toUpperCase(), x, y + 88);

    if (g.brownout > 0.15) {
      ctx.fillStyle = '#ff8a3d';
      ctx.fillText('! POWER BROWNOUT - actuators exceed supply', x, y + 104);
    }
    if (p && !p.dead && !p.grounded && !p.hover) {
      ctx.fillStyle = '#c9a8ff';
      ctx.fillText('! OVER THE VOID - no float core', x, y + (g.brownout > 0.15 ? 120 : 104));
    }

    // Run stats, right-aligned under the minimap.
    ctx.textAlign = 'right';
    ctx.font = `600 12px ${FONT}`;
    ctx.fillStyle = '#8ea3c9';
    ctx.fillText(`WRECKED ${g.kills}`, W - 20, 210);
    ctx.fillText(`SALVAGED ${g.salvaged}`, W - 20, 226);
    ctx.fillText(`${Math.floor(g.distanceTravelled / 100)}m TRAVELLED`, W - 20, 242);
    ctx.textAlign = 'left';
  }

  drawHotbar(ctx, W, H) {
    const g = this.game;
    const slot = 54, gap = 6;
    const n = BUILDABLE.length;
    const total = n * slot + (n - 1) * gap;
    const x0 = (W - total) / 2;
    const y = H - slot - 22;

    for (let i = 0; i < n; i++) {
      const id = BUILDABLE[i];
      const def = PARTS[id];
      const count = g.inventory[id] || 0;
      const selected = g.selectedIndex === i;
      const x = x0 + i * (slot + gap);

      ctx.fillStyle = selected ? 'rgba(57,230,255,0.16)' : 'rgba(8,10,18,0.72)';
      ctx.fillRect(x, y, slot, slot);
      ctx.strokeStyle = selected ? '#39e6ff' : 'rgba(140,160,200,0.28)';
      ctx.lineWidth = selected ? 2 : 1;
      ctx.strokeRect(x + 0.5, y + 0.5, slot - 1, slot - 1);

      // Draw the part's real silhouette as its icon.
      ctx.save();
      ctx.translate(x + slot / 2, y + slot / 2 - 4);
      const s = clamp(17 / def.reach, 0.35, 1.05);
      ctx.scale(s, s);
      ctx.globalAlpha = count > 0 ? 1 : 0.25;
      ctx.beginPath();
      const v = def.verts;
      ctx.moveTo(v[0].x, v[0].y);
      for (let k = 1; k < v.length; k++) ctx.lineTo(v[k].x, v[k].y);
      ctx.closePath();
      ctx.fillStyle = def.color;
      ctx.fill();
      ctx.lineWidth = 2 / s;
      ctx.strokeStyle = def.accent;
      ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;

      ctx.font = `700 11px ${FONT}`;
      ctx.fillStyle = count > 0 ? '#e8f0ff' : '#5f6f8f';
      ctx.textAlign = 'center';
      ctx.fillText(`${count}`, x + slot / 2, y + slot - 15);
      ctx.font = `500 9px ${FONT}`;
      ctx.fillStyle = '#5f6f8f';
      ctx.fillText(`${i + 1 <= 9 ? i + 1 : '0'}`, x + 8, y + 5);
      ctx.textAlign = 'left';
    }

    ctx.font = `500 11px ${FONT}`;
    ctx.fillStyle = g.buildMode ? '#39e6ff' : '#5f6f8f';
    ctx.textAlign = 'center';
    ctx.fillText(
      g.buildMode
        ? 'BUILD MODE  ·  LMB weld  ·  RMB salvage part  ·  Q/E rotate  ·  wheel cycle  ·  B exit'
        : 'WASD move  ·  mouse aim  ·  LMB fire  ·  RMB mortar  ·  SHIFT dash  ·  B build',
      W / 2, y - 20,
    );
    ctx.textAlign = 'left';
  }

  drawMinimap(ctx, W, H) {
    const S = this.minimap.width;
    const x = W - S - 20, y = 20;
    const g = this.game;
    const o = this.minimapOrigin;

    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.drawImage(this.minimap, x, y);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(140,160,200,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, S - 1, S - 1);

    const toMap = (wx, wy) => ({
      x: x + ((wx - o.x + o.range) / (o.range * 2)) * S,
      y: y + ((wy - o.y + o.range) / (o.range * 2)) * S,
    });

    // Live overlay: enemies, pickups, the player.
    for (const b of g.physics.bodies) {
      if (b.dead) continue;
      let color = null, size = 2;
      if (b.tag === 'enemy') { color = b.bossName ? '#ff3b5c' : '#ff8a5c'; size = b.bossName ? 5 : 3; }
      else if (b.tag === 'player') { color = '#39e6ff'; size = 4; }
      if (!color) continue;
      const m = toMap(b.pos.x, b.pos.y);
      if (m.x < x || m.y < y || m.x > x + S || m.y > y + S) continue;
      ctx.fillStyle = color;
      ctx.fillRect(m.x - size / 2, m.y - size / 2, size, size);
    }
    ctx.fillStyle = '#ffd27a';
    for (const p of g.pickups) {
      const m = toMap(p.x, p.y);
      if (m.x < x || m.y < y || m.x > x + S || m.y > y + S) continue;
      ctx.fillRect(m.x - 1, m.y - 1, 2, 2);
    }
    ctx.restore();
  }

  drawBuildPanel(ctx, W, H) {
    const g = this.game;
    const id = BUILDABLE[g.selectedIndex];
    const def = PARTS[id];
    const x = 20, y = H - 250, w = 340;

    ctx.fillStyle = 'rgba(8,10,18,0.82)';
    ctx.fillRect(x, y, w, 132);
    ctx.strokeStyle = 'rgba(57,230,255,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 131);

    ctx.font = `700 14px ${FONT}`;
    ctx.fillStyle = '#39e6ff';
    ctx.fillText(def.name.toUpperCase(), x + 14, y + 14);

    ctx.font = `500 11px ${FONT}`;
    ctx.fillStyle = '#8ea3c9';
    wrapText(ctx, def.desc || '', x + 14, y + 36, w - 28, 14);

    const stats = [
      ['MASS', (def.density * areaOf(def.verts)).toFixed(2)],
      ['HP', String(def.hp)],
      ['WELD', String(def.weldHp)],
      ['ENERGY', def.energy > 0 ? `+${def.energy}` : String(def.energy)],
    ];
    ctx.font = `600 11px ${FONT}`;
    stats.forEach((s, i) => {
      const sx = x + 14 + (i % 4) * 82;
      ctx.fillStyle = '#5f6f8f';
      ctx.fillText(s[0], sx, y + 96);
      ctx.fillStyle = s[1].startsWith('-') ? '#ff8a3d' : '#e8f0ff';
      ctx.fillText(s[1], sx, y + 110);
    });
  }

  drawToast(ctx, W, H) {
    if (this.toastTime <= 0 || !this.toast) return;
    const a = clamp(this.toastTime, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `600 15px ${FONT}`;
    ctx.textAlign = 'center';
    const wpx = ctx.measureText(this.toast).width + 32;
    ctx.fillStyle = 'rgba(8,10,18,0.8)';
    ctx.fillRect(W / 2 - wpx / 2, 96, wpx, 32);
    ctx.fillStyle = '#e8f0ff';
    ctx.fillText(this.toast, W / 2, 105);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  drawDeath(ctx, W, H) {
    ctx.save();
    ctx.fillStyle = 'rgba(6,8,14,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = `700 44px ${FONT}`;
    ctx.fillStyle = '#ff5a5a';
    ctx.fillText('CHASSIS LOST', W / 2, H / 2 - 70);
    ctx.font = `500 15px ${FONT}`;
    ctx.fillStyle = '#8ea3c9';
    ctx.fillText(`${this.game.kills} machines wrecked  ·  ${this.game.salvaged} modules salvaged`, W / 2, H / 2 - 12);
    ctx.fillText(`${Math.floor(this.game.distanceTravelled / 100)}m of frontier crossed`, W / 2, H / 2 + 10);
    ctx.font = `700 17px ${FONT}`;
    ctx.fillStyle = '#39e6ff';
    ctx.fillText('PRESS  R  TO REBUILD', W / 2, H / 2 + 60);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  drawTitle(ctx, W, H) {
    ctx.save();
    ctx.fillStyle = 'rgba(6,8,14,0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';

    ctx.font = `700 15px ${FONT}`;
    ctx.fillStyle = '#39e6ff';
    ctx.fillText('T H E   G R A N D   F R O N T I E R', W / 2, H / 2 - 150);
    ctx.font = `700 76px ${FONT}`;
    ctx.fillStyle = '#e8f0ff';
    ctx.fillText('OMNI', W / 2, H / 2 - 120);

    ctx.font = `500 14px ${FONT}`;
    ctx.fillStyle = '#8ea3c9';
    const lines = [
      'Break the world apart. Weld it back together as something meaner.',
      '',
      'WASD thrust      MOUSE aim      LMB fire      RMB mortar      SHIFT dash',
      'B build mode     1-0 select part     Q/E rotate     WHEEL cycle',
      '',
      'Everything is physics. Mount thrusters off-center and you will spin.',
      'Bolt on too much and you will brown out. Welds fail before parts do.',
    ];
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 - 20 + i * 22));

    ctx.font = `700 18px ${FONT}`;
    ctx.fillStyle = '#ffd27a';
    ctx.fillText('CLICK TO DEPLOY', W / 2, H / 2 + 170);
    ctx.textAlign = 'left';
    ctx.restore();
  }
}

function areaOf(verts) {
  let a = 0;
  for (let i = 0; i < verts.length; i++) {
    const p0 = verts[i], p1 = verts[(i + 1) % verts.length];
    a += p0.x * p1.y - p1.x * p0.y;
  }
  return Math.abs(a / 2);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let ly = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, ly);
      line = w;
      ly += lineHeight;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, ly);
}


// ===== src/audio/audio.js =====
// Everything you hear is synthesised at runtime with the Web Audio API -- there
// are no audio files in this project. Impacts are noise bursts shaped by
// bandpass filters, explosions are pitch-swept sines under filtered noise, and
// the soundtrack is a sequencer that rewrites its own arrangement as combat
// heats up.

const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);

// Am - F - C - G, the backbone of every synthwave track ever written.
const PROGRESSION = [
  { root: 45, chord: [45, 48, 52] },   // Am
  { root: 41, chord: [41, 45, 48] },   // F
  { root: 48, chord: [48, 52, 55] },   // C
  { root: 43, chord: [43, 47, 50] },   // G
];

class AudioEngine {
  constructor(bus) {
    this.bus = bus;
    this.ctx = null;
    this.ready = false;
    this.enabled = true;
    this.listener = { x: 0, y: 0 };
    this.combat = 0;          // 0..1, drives the arrangement
    this.voices = 0;
    this.maxVoices = 26;

    this.bpm = 126;
    this.step = 0;            // 16th-note counter
    this.nextNoteTime = 0;
    this.lookahead = 0.12;

    this.bindEvents();
  }

  bindEvents() {
    const b = this.bus;
    b.on('sfx:impact', (e) => this.impact(e));
    b.on('sfx:explosion', (e) => this.explosion(e));
    b.on('sfx:break', (e) => this.breakage(e));
    b.on('sfx:dash', (e) => this.whoosh(e, 1));
    b.on('sfx:throw', (e) => this.whoosh(e, 0.7));
    b.on('sfx:charge', (e) => this.charge(e));
    b.on('weapon:fired', (e) => this.shot(e));
    b.on('enemy:alert', (e) => this.alert(e));
    b.on('salvage:pickup', (e) => this.pickup(e));
    b.on('build:place', (e) => this.weldSound(e, 1));
    b.on('build:remove', (e) => this.weldSound(e, 0.6));
    b.on('ui:click', () => this.blip(880, 0.05));
    b.on('ui:deny', () => this.blip(160, 0.09, 'square'));
  }

  /** Must be called from a user gesture -- browsers refuse audio otherwise. */
  start() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = (this.ctx = new Ctx());

    this.master = ctx.createGain();
    this.master.gain.value = 0.85;

    // A limiter keeps a dozen simultaneous explosions from clipping.
    this.comp = ctx.createDynamicsCompressor();
    this.comp.threshold.value = -14;
    this.comp.knee.value = 22;
    this.comp.ratio.value = 9;
    this.comp.attack.value = 0.004;
    this.comp.release.value = 0.18;

    this.sfxBus = ctx.createGain();
    this.sfxBus.gain.value = 0.9;
    this.musicBus = ctx.createGain();
    this.musicBus.gain.value = 0.36;

    // Shared delay for leads and impacts -- glue, and it costs one node.
    this.delay = ctx.createDelay(0.6);
    this.delay.delayTime.value = 60 / this.bpm * 0.75;
    this.delayFb = ctx.createGain();
    this.delayFb.gain.value = 0.34;
    this.delayFilter = ctx.createBiquadFilter();
    this.delayFilter.type = 'lowpass';
    this.delayFilter.frequency.value = 2200;
    this.delay.connect(this.delayFb).connect(this.delayFilter).connect(this.delay);
    this.delay.connect(this.musicBus);

    this.sfxBus.connect(this.comp);
    this.musicBus.connect(this.comp);
    this.comp.connect(this.master);
    this.master.connect(ctx.destination);

    this.noiseBuffer = this.makeNoise(2.0);
    this.startThrusterVoice();

    this.nextNoteTime = ctx.currentTime + 0.08;
    this.ready = true;
  }

  makeNoise(seconds) {
    const ctx = this.ctx;
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  // --- routing helpers -----------------------------------------------------

  /** Positional gain + stereo pan relative to the listener. */
  place(x, y, baseGain) {
    const ctx = this.ctx;
    const dx = x - this.listener.x;
    const dy = y - this.listener.y;
    const d = Math.hypot(dx, dy);
    const atten = clamp(1 - d / 1600, 0, 1);
    if (atten <= 0.01) return null;

    const g = ctx.createGain();
    g.gain.value = baseGain * atten * atten;
    let node = g;
    if (ctx.createStereoPanner) {
      const pan = ctx.createStereoPanner();
      pan.pan.value = clamp(dx / 900, -0.85, 0.85);
      g.connect(pan);
      node = pan;
    }
    node.connect(this.sfxBus);
    return g;
  }

  noiseSource(duration, playbackRate = 1) {
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer;
    src.playbackRate.value = playbackRate;
    src.loop = true;
    src.start(this.ctx.currentTime, Math.random() * 1.5);
    src.stop(this.ctx.currentTime + duration);
    return src;
  }

  budget() {
    if (!this.ready || !this.enabled) return false;
    if (this.voices > this.maxVoices) return false;
    this.voices++;
    setTimeout(() => { this.voices--; }, 320);
    return true;
  }

  // --- sound effects -------------------------------------------------------

  /** Crisp metallic hit: filtered noise transient plus a struck-metal ping. */
  impact({ x, y, power, damage }) {
    if (!this.budget()) return;
    const ctx = this.ctx;
    const t = ctx.currentTime;
    const out = this.place(x, y, 0.5 * (0.35 + power));
    if (!out) return;

    const dur = 0.14 + power * 0.16;
    const noise = this.noiseSource(dur, 1 + power);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(2600 + Math.random() * 2200, t);
    bp.frequency.exponentialRampToValueAtTime(700 + Math.random() * 500, t + dur);
    bp.Q.value = 3.5;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.9, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + dur);
    noise.connect(bp).connect(ng).connect(out);

    // Two detuned partials give the "struck plate" character.
    const base = 320 + Math.random() * 620 - power * 120;
    for (const [mult, gain] of [[1, 0.5], [2.41, 0.26], [3.83, 0.12]]) {
      const o = ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.setValueAtTime(base * mult, t);
      o.frequency.exponentialRampToValueAtTime(base * mult * 0.82, t + dur * 1.5);
      const g = ctx.createGain();
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur * 1.6);
      o.connect(g).connect(out);
      o.start(t); o.stop(t + dur * 1.7);
    }

    // Real damage adds a low thud underneath the tink.
    if (damage > 8) {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(50, t + 0.18);
      const g = ctx.createGain();
      g.gain.setValueAtTime(clamp(damage / 120, 0.1, 0.7), t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(g).connect(out);
      o.start(t); o.stop(t + 0.22);
    }
  }

  /** Deep bass explosion: sub sweep, filtered roar, transient crack. */
  explosion({ x, y, power = 1 }) {
    if (!this.budget()) return;
    const ctx = this.ctx;
    const t = ctx.currentTime;
    const out = this.place(x, y, 0.95 * power);
    if (!out) return;

    const sub = ctx.createOscillator();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(160, t);
    sub.frequency.exponentialRampToValueAtTime(26, t + 0.75);
    const sg = ctx.createGain();
    sg.gain.setValueAtTime(1.0, t);
    sg.gain.exponentialRampToValueAtTime(0.001, t + 0.85);
    sub.connect(sg).connect(out);
    sub.start(t); sub.stop(t + 0.9);

    const roar = this.noiseSource(0.9, 0.6);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400, t);
    lp.frequency.exponentialRampToValueAtTime(90, t + 0.8);
    lp.Q.value = 1.2;
    const rg = ctx.createGain();
    rg.gain.setValueAtTime(0.85, t);
    rg.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
    roar.connect(lp).connect(rg).connect(out);

    const crack = this.noiseSource(0.06, 2.2);
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 1800;
    const cg = ctx.createGain();
    cg.gain.setValueAtTime(0.7, t);
    cg.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    crack.connect(hp).connect(cg).connect(out);
  }

  /** Structural failure: a short crunch of scraping grains. */
  breakage({ x, y, power = 0.5 }) {
    if (!this.budget()) return;
    const ctx = this.ctx;
    const t = ctx.currentTime;
    const out = this.place(x, y, 0.5 * power);
    if (!out) return;
    for (let i = 0; i < 4; i++) {
      const at = t + i * (0.012 + Math.random() * 0.03);
      const n = ctx.createBufferSource();
      n.buffer = this.noiseBuffer;
      n.playbackRate.value = 0.6 + Math.random() * 1.4;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 500 + Math.random() * 2500;
      bp.Q.value = 5;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.5, at);
      g.gain.exponentialRampToValueAtTime(0.001, at + 0.09);
      n.connect(bp).connect(g).connect(out);
      n.start(at, Math.random()); n.stop(at + 0.1);
    }
  }

  shot({ x, y, type }) {
    if (!this.budget()) return;
    const ctx = this.ctx;
    const t = ctx.currentTime;
    const heavy = type === 'shell';
    const out = this.place(x, y, heavy ? 0.75 : 0.34);
    if (!out) return;

    const o = ctx.createOscillator();
    o.type = heavy ? 'sawtooth' : 'square';
    const f0 = heavy ? 420 : 1150;
    const f1 = heavy ? 70 : 240;
    const dur = heavy ? 0.3 : 0.13;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(f0 * 1.4, t);
    bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    bp.Q.value = 2.4;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.8, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(bp).connect(g).connect(out);
    o.start(t); o.stop(t + dur + 0.02);

    const click = this.noiseSource(0.05, 1.8);
    const cg = ctx.createGain();
    cg.gain.setValueAtTime(heavy ? 0.5 : 0.3, t);
    cg.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    click.connect(cg).connect(out);
  }

  whoosh({ x, y }, power = 1) {
    if (!this.budget()) return;
    const ctx = this.ctx;
    const t = ctx.currentTime;
    const out = this.place(x, y, 0.4 * power);
    if (!out) return;
    const n = this.noiseSource(0.34, 1);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(320, t);
    bp.frequency.exponentialRampToValueAtTime(2600, t + 0.12);
    bp.frequency.exponentialRampToValueAtTime(280, t + 0.34);
    bp.Q.value = 1.6;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.8, t + 0.07);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
    n.connect(bp).connect(g).connect(out);
  }

  charge({ x, y }) {
    if (!this.budget()) return;
    const ctx = this.ctx;
    const t = ctx.currentTime;
    const out = this.place(x, y, 0.35);
    if (!out) return;
    const o = ctx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(90, t);
    o.frequency.exponentialRampToValueAtTime(420, t + 0.45);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(400, t);
    lp.frequency.exponentialRampToValueAtTime(2600, t + 0.45);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.55, t + 0.4);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.connect(lp).connect(g).connect(out);
    o.start(t); o.stop(t + 0.52);
  }

  alert({ body }) {
    if (!this.budget()) return;
    const t = this.ctx.currentTime;
    this.blipAt(body.pos.x, body.pos.y, 660, t, 0.07);
    this.blipAt(body.pos.x, body.pos.y, 880, t + 0.09, 0.07);
  }

  pickup() {
    if (!this.budget()) return;
    const t = this.ctx.currentTime;
    this.blip(1320, 0.05, 'triangle', t);
    this.blip(1760, 0.06, 'triangle', t + 0.05);
  }

  weldSound({ x, y }, power) {
    if (!this.budget()) return;
    const ctx = this.ctx;
    const t = ctx.currentTime;
    const out = this.place(x, y, 0.4 * power);
    if (!out) return;
    const n = this.noiseSource(0.16, 1.6);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(3200, t);
    bp.frequency.exponentialRampToValueAtTime(900, t + 0.16);
    bp.Q.value = 4;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.7, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    n.connect(bp).connect(g).connect(out);
    this.blip(power > 0.8 ? 1046 : 523, 0.07, 'square', t + 0.02);
  }

  blipAt(x, y, freq, when, dur = 0.06, type = 'square') {
    const ctx = this.ctx;
    const out = this.place(x, y, 0.3);
    if (!out) return;
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.5, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    o.connect(g).connect(out);
    o.start(when); o.stop(when + dur + 0.01);
  }

  blip(freq, dur = 0.06, type = 'square', when = null) {
    if (!this.ready || !this.enabled) return;
    const ctx = this.ctx;
    const t = when ?? ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(this.sfxBus);
    o.start(t); o.stop(t + dur + 0.01);
  }

  // --- continuous thruster hum --------------------------------------------

  startThrusterVoice() {
    const ctx = this.ctx;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = 62;
    const sub = ctx.createOscillator();
    sub.type = 'sine';
    sub.frequency.value = 31;

    const noise = ctx.createBufferSource();
    noise.buffer = this.noiseBuffer;
    noise.loop = true;

    this.thrustFilter = ctx.createBiquadFilter();
    this.thrustFilter.type = 'lowpass';
    this.thrustFilter.frequency.value = 220;
    this.thrustFilter.Q.value = 3.5;

    this.thrustGain = ctx.createGain();
    this.thrustGain.gain.value = 0;

    osc.connect(this.thrustFilter);
    sub.connect(this.thrustFilter);
    noise.connect(this.thrustFilter);
    this.thrustFilter.connect(this.thrustGain).connect(this.sfxBus);

    osc.start(t); sub.start(t); noise.start(t);
    this.thrustOsc = osc;
    this.thrustSub = sub;
  }

  /** Called every frame with the player's engine load and combat pressure. */
  update(dt, state) {
    if (!this.ready || !this.enabled) return;
    const ctx = this.ctx;
    this.listener = state.listener || this.listener;

    // Engine hum tracks actual thruster activation and energy brownout.
    const load = clamp(state.thrust || 0, 0, 1);
    const target = load * 0.16;
    this.thrustGain.gain.setTargetAtTime(target, ctx.currentTime, 0.08);
    this.thrustFilter.frequency.setTargetAtTime(180 + load * 900, ctx.currentTime, 0.1);
    this.thrustOsc.frequency.setTargetAtTime(56 + load * 46 - (state.brownout || 0) * 18, ctx.currentTime, 0.15);

    this.combat += (clamp(state.combat || 0, 0, 1) - this.combat) * Math.min(1, dt * 1.2);
    this.musicBus.gain.setTargetAtTime(state.musicOn === false ? 0 : 0.3 + this.combat * 0.16, ctx.currentTime, 0.4);

    this.scheduleMusic();
  }

  // --- the sequencer -------------------------------------------------------

  /**
   * Lookahead scheduler. Every 16th note it decides what the arrangement should
   * be *right now* based on combat intensity: calm exploration is bass and pad
   * only; a fight adds drums, hats and a delayed arpeggio lead, and pushes the
   * filter open.
   */
  scheduleMusic() {
    const ctx = this.ctx;
    const secondsPerStep = (60 / (this.bpm + this.combat * 16)) / 4;
    while (this.nextNoteTime < ctx.currentTime + this.lookahead) {
      this.playStep(this.step, this.nextNoteTime);
      this.nextNoteTime += secondsPerStep;
      this.step = (this.step + 1) % 64;
    }
  }

  playStep(step, when) {
    const bar = Math.floor(step / 16) % PROGRESSION.length;
    const beat = step % 16;
    const chord = PROGRESSION[bar];
    const intensity = this.combat;

    // --- bass: driving 8ths, the constant of the genre ---
    if (beat % 2 === 0) {
      const note = chord.root + (beat === 8 ? 12 : 0) + (beat === 14 ? 7 : 0);
      this.synthNote({
        freq: midi(note), when, dur: 0.16,
        type: 'sawtooth', gain: 0.22 + intensity * 0.06,
        filterFrom: 380 + intensity * 900, filterTo: 160, q: 7,
      });
    }

    // --- pad: one long chord per bar ---
    if (beat === 0) {
      for (const n of chord.chord) {
        this.synthNote({
          freq: midi(n + 12), when, dur: (60 / this.bpm) * 3.6,
          type: 'sawtooth', gain: 0.045 + intensity * 0.02,
          filterFrom: 700 + intensity * 1400, filterTo: 500,
          attack: 0.35, q: 1.2, detune: 7,
        });
      }
    }

    // --- drums: only once things get dangerous ---
    if (intensity > 0.12) {
      if (beat === 0 || beat === 6 || beat === 10) this.kick(when, 0.5 + intensity * 0.5);
      if (beat === 4 || beat === 12) this.snare(when, 0.35 + intensity * 0.45);
      if (intensity > 0.4 && beat % 2 === 1) this.hat(when, 0.10 + intensity * 0.13);
    }

    // --- lead arpeggio: the "we are in trouble" layer ---
    if (intensity > 0.45 && beat % 2 === 0) {
      const idx = (step / 2) % 4;
      const n = chord.chord[idx % chord.chord.length] + 24 + (idx === 3 ? 3 : 0);
      const g = this.synthNote({
        freq: midi(n), when, dur: 0.12,
        type: 'square', gain: 0.06 * (intensity - 0.35),
        filterFrom: 3200, filterTo: 1400, q: 3,
        send: this.delay,
      });
      void g;
    }
  }

  synthNote({ freq, when, dur, type, gain, filterFrom, filterTo, q = 1, attack = 0.006, detune = 0, send = null }) {
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.value = freq;
    if (detune) o.detune.value = (Math.random() - 0.5) * detune * 2;

    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.Q.value = q;
    f.frequency.setValueAtTime(filterFrom, when);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, filterTo), when + dur);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);

    o.connect(f).connect(g).connect(this.musicBus);
    if (send) g.connect(send);
    o.start(when);
    o.stop(when + dur + 0.03);
    return g;
  }

  kick(when, amp) {
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, when);
    o.frequency.exponentialRampToValueAtTime(42, when + 0.11);
    const g = ctx.createGain();
    g.gain.setValueAtTime(amp * 0.7, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.24);
    o.connect(g).connect(this.musicBus);
    o.start(when); o.stop(when + 0.26);
  }

  snare(when, amp) {
    const ctx = this.ctx;
    const n = ctx.createBufferSource();
    n.buffer = this.noiseBuffer;
    n.playbackRate.value = 1.4;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1900;
    bp.Q.value = 0.9;
    const g = ctx.createGain();
    g.gain.setValueAtTime(amp * 0.32, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.17);
    n.connect(bp).connect(g).connect(this.musicBus);
    n.start(when, Math.random()); n.stop(when + 0.18);
  }

  hat(when, amp) {
    const ctx = this.ctx;
    const n = ctx.createBufferSource();
    n.buffer = this.noiseBuffer;
    n.playbackRate.value = 2.4;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 7200;
    const g = ctx.createGain();
    g.gain.setValueAtTime(amp * 0.2, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.05);
    n.connect(hp).connect(g).connect(this.musicBus);
    n.start(when, Math.random()); n.stop(when + 0.06);
  }

  setEnabled(on) {
    this.enabled = on;
    if (this.master) this.master.gain.setTargetAtTime(on ? 0.85 : 0, this.ctx.currentTime, 0.05);
  }
}


// ===== src/game/combat.js =====
// Damage thresholds tuned against the mass scale in parts.js. A bare ram at
// walking pace does nothing; a loaded chassis at full boost caves in a plate.
const IMPACT_THRESHOLD = 620;
const IMPACT_SCALE = 0.012;
const WELD_FATIGUE = 0.5;

/**
 * Combat is deliberately thin. It does not know what a "player attack" is --
 * it knows that two parts collided hard, or that a projectile landed, and it
 * turns that into durability loss, weld fatigue, knockback and juice. Because
 * it is driven purely by physics events, an enemy crushed between a boulder and
 * a cliff dies through the exact same path as one you shot.
 */
class Combat {
  constructor(ctx) {
    this.world = ctx.world;
    this.bus = ctx.bus;
    this.fx = ctx.fx;
    this.juice = ctx.juice;
    this.game = ctx.game;

    this.bus.on('impact', (ev) => this.onImpact(ev));
    this.bus.on('part:destroyed', (ev) => this.onPartDestroyed(ev));
  }

  /**
   * Core damage entry point. Everything -- bullets, blades, falls, explosions,
   * a dropped boulder -- funnels through here.
   */
  applyDamage(body, part, amount, opts = {}) {
    if (!body || !part || amount <= 0 || body.dead) return 0;
    if (body.invuln > 0 && opts.type !== 'void') return 0;
    if (part.hp <= 0) return 0;

    const dealt = Math.min(amount, part.hp);
    if (part.damage(amount)) body.needsStructureCheck = true;

    // Structural destruction: damage does not stay local. It fatigues every
    // weld holding the struck part, so sustained fire on one corner eventually
    // shears that corner off even if the part itself survives.
    for (const w of body.weldsOf(part.id)) {
      w.hp -= amount * WELD_FATIGUE;
      if (w.hp <= 0) body.needsStructureCheck = true;
    }

    body.wake();
    this.bus.emit('damage', {
      body, part, amount: dealt,
      point: opts.point || part.wpos,
      dir: opts.dir || { x: 0, y: -1 },
      type: opts.type || 'generic',
      source: opts.source || null,
    });
    return dealt;
  }

  /** Physics contact -> collision damage, blade strikes, sparks, hitstop. */
  onImpact(ev) {
    const { bodyA, partA, bodyB, partB, impulse, point, normal } = ev;
    if (impulse < IMPACT_THRESHOLD * 0.35) return;

    const va = bodyA.pointVel(point.x, point.y);
    const vb = bodyB.pointVel(point.x, point.y);
    const relSpeed = Math.hypot(vb.x - va.x, vb.y - va.y);

    const base = Math.max(0, (impulse - IMPACT_THRESHOLD) * IMPACT_SCALE);
    let dmgToA = base, dmgToB = base;

    // Blades convert their own momentum into concentrated damage. A blade that
    // is merely resting against you does almost nothing; one swung at speed on
    // a charged trigger is lethal.
    const bladeA = partA.def.kind === 'blade';
    const bladeB = partB.def.kind === 'blade';
    if (bladeA) {
      dmgToB += partA.def.damage * (0.35 + partA.heat) * (0.4 + relSpeed / 520);
      dmgToA *= 0.25;
    }
    if (bladeB) {
      dmgToA += partB.def.damage * (0.35 + partB.heat) * (0.4 + relSpeed / 520);
      dmgToB *= 0.25;
    }

    // Rate-limit repeat hits between the same pair so a blade resting on a hull
    // does not tick every frame.
    const key = partB.id;
    const now = this.game.time;
    const lastA = bodyA.contactCooldown.get(key) || -1;
    if (now - lastA < 0.11 && (bladeA || bladeB)) return;
    bodyA.contactCooldown.set(key, now);

    const dealtB = this.applyDamage(bodyB, partB, dmgToB, {
      point, dir: normal, type: 'impact', source: bodyA,
    });
    const dealtA = this.applyDamage(bodyA, partA, dmgToA, {
      point, dir: { x: -normal.x, y: -normal.y }, type: 'impact', source: bodyB,
    });

    // Extra knockback beyond the solver's own response, so a charged blade
    // visibly throws things rather than nudging them.
    if (bladeA || bladeB) {
      const blade = bladeA ? partA : partB;
      const victim = bladeA ? bodyB : bodyA;
      const s = bladeA ? 1 : -1;
      const j = blade.def.damage * (0.6 + blade.heat) * 26;
      victim.applyImpulse(normal.x * j * s, normal.y * j * s, point.x, point.y);
    }

    const total = dealtA + dealtB;
    this.reactToHit(point, normal, total, impulse, relSpeed, bodyA, bodyB);
  }

  /** All the "juice" for a hit lives in one place so every damage source gets it. */
  reactToHit(point, normal, damage, impulse, relSpeed, bodyA, bodyB) {
    const involvesPlayer = bodyA?.tag === 'player' || bodyB?.tag === 'player';
    const mag = clamp(impulse / 9000, 0, 1);

    if (damage > 0.5) {
      this.fx.sparks(point.x, point.y, normal, clamp(damage / 6, 2, 16), relSpeed);
    }
    if (mag > 0.06) {
      this.fx.shockRing(point.x, point.y, 12 + mag * 46, mag);
    }

    // Hitstop: freeze the world for a few milliseconds so heavy hits land with
    // weight. Scaled by damage and capped so it never feels like a stutter.
    if (damage > 6) {
      const stop = clamp(damage / 340, 0, 1) * 0.085;
      this.juice.hitstop(involvesPlayer ? stop * 1.35 : stop * 0.6);
    }

    if (damage > 2 || mag > 0.15) {
      this.juice.shakeAt(point.x, point.y, clamp(damage / 90 + mag * 0.35, 0, 0.85), normal);
    }

    this.bus.emit('sfx:impact', {
      x: point.x, y: point.y,
      power: clamp(impulse / 8000, 0.05, 1),
      damage,
      metallic: true,
    });
  }

  /** A destroyed part sheds salvage, and some parts go off when they die. */
  onPartDestroyed({ body, part }) {
    const def = part.def;
    this.fx.debris(part, 6 + Math.floor(def.hp / 40));
    this.fx.shockRing(part.wpos.x, part.wpos.y, def.reach * 2.4, 0.5);
    this.juice.shakeAt(part.wpos.x, part.wpos.y, 0.3, { x: 0, y: -1 });

    if (def.explodeOnDeath) {
      const e = def.explodeOnDeath;
      this.world.explode(part.wpos.x, part.wpos.y, e.radius, e.force, e.damage);
      this.fx.explosion(part.wpos.x, part.wpos.y, e.radius);
      this.juice.hitstop(0.06);
      this.juice.shakeAt(part.wpos.x, part.wpos.y, 0.8, { x: 0, y: -1 });
      this.bus.emit('sfx:explosion', { x: part.wpos.x, y: part.wpos.y, power: 1 });
    } else {
      this.bus.emit('sfx:break', { x: part.wpos.x, y: part.wpos.y, power: clamp(def.hp / 300, 0.2, 1) });
    }

    // Salvage: world material and enemy hardware alike drop usable modules.
    const drops = [];
    if (def.salvage) {
      const n = 1 + (Math.random() < 0.45 ? 1 : 0);
      for (let i = 0; i < n; i++) {
        drops.push(def.salvage[Math.floor(Math.random() * def.salvage.length)]);
      }
    } else if (body.tag === 'enemy' && Math.random() < 0.55) {
      // Enemies drop the very module you just blew off them.
      drops.push(def.id);
    }
    for (const d of drops) {
      this.bus.emit('salvage:drop', {
        partId: d,
        x: part.wpos.x + (Math.random() - 0.5) * 24,
        y: part.wpos.y + (Math.random() - 0.5) * 24,
      });
    }
  }

  /** Projectile resolution, called by the game loop. */
  onProjectileHit(proj, hit) {
    if (!hit) {
      // Expired mid-air: shells still detonate.
      if (proj.def.explode) this.detonate(proj, proj.x, proj.y);
      return;
    }
    const { body, part, point } = hit;
    const dir = { x: proj.vx, y: proj.vy };
    const l = Math.hypot(dir.x, dir.y) || 1;
    dir.x /= l; dir.y /= l;

    if (proj.def.explode) {
      this.detonate(proj, point.x, point.y);
      return;
    }

    const dealt = this.applyDamage(body, part, proj.def.damage, {
      point, dir, type: 'projectile', source: proj.owner,
    });
    body.applyImpulse(dir.x * proj.def.knockback * 6, dir.y * proj.def.knockback * 6, point.x, point.y);

    this.fx.sparks(point.x, point.y, { x: -dir.x, y: -dir.y }, 7, 700);
    this.fx.shockRing(point.x, point.y, 16, 0.3);
    if (dealt > 0) this.juice.hitstop(0.018);
    this.juice.shakeAt(point.x, point.y, 0.12, dir);
    this.bus.emit('sfx:impact', { x: point.x, y: point.y, power: 0.35, damage: dealt, metallic: true });
  }

  detonate(proj, x, y) {
    const e = proj.def.explode;
    this.world.explode(x, y, e.radius, e.force, e.damage, {
      exclude: (b) => b === proj.owner && b.invuln > 0,
    });
    this.fx.explosion(x, y, e.radius);
    this.juice.hitstop(0.07);
    this.juice.shakeAt(x, y, 0.9, { x: 0, y: -1 });
    this.bus.emit('sfx:explosion', { x, y, power: 1 });
  }
}


// ===== src/game/projectiles.js =====
const PROJECTILE_TYPES = {
  bolt: {
    speed: 1750, damage: 26, life: 1.1, radius: 3.5, knockback: 120,
    color: '#ffd27a', trail: '#ff8a3d', glow: 12,
  },
  shell: {
    speed: 820, damage: 30, life: 2.6, radius: 7, knockback: 200,
    color: '#ff9a3d', trail: '#ff5a2b', glow: 20,
    explode: { radius: 165, force: 620, damage: 70 },
  },
  slug: {
    speed: 1250, damage: 46, life: 1.6, radius: 5, knockback: 320,
    color: '#ff6b8a', trail: '#ff2d55', glow: 16,
  },
};

/**
 * Projectiles are swept points rather than rigid bodies: they raycast from
 * their previous position to their next one, so nothing tunnels through a thin
 * plate at 1750 units/sec. They still deliver real impulses, so getting shot
 * shoves your chassis around and can tear welds loose.
 */
class Projectiles {
  constructor(world, bus) {
    this.world = world;
    this.bus = bus;
    this.list = [];
  }

  spawn({ type, x, y, dir, owner, team, part, speedScale = 1, spread = 0 }) {
    const def = PROJECTILE_TYPES[type] || PROJECTILE_TYPES.bolt;
    let dx = dir.x, dy = dir.y;
    if (spread) {
      const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * spread;
      const d = fromAngle(a);
      dx = d.x; dy = d.y;
    }
    // Inherit the shooter's velocity so firing while boosting feels connected.
    const ov = owner ? owner.pointVel(x, y) : { x: 0, y: 0 };
    const speed = def.speed * speedScale;
    this.list.push({
      type, def, x, y,
      px: x, py: y,
      vx: dx * speed + ov.x * 0.35,
      vy: dy * speed + ov.y * 0.35,
      life: def.life,
      owner, team,
      sourcePart: part,
    });
    this.bus.emit('weapon:fired', { x, y, type, dir: { x: dx, y: dy }, owner });
    return this.list[this.list.length - 1];
  }

  update(dt, onHit) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.px = p.x; p.py = p.y;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;

      // Friendly fire is intentionally allowed against everything except the
      // shooter itself: a Lancer's stray bolt shattering a Bruiser's hull is
      // exactly the kind of accident this game is built to produce.
      const hit = this.world.raycast(p.px, p.py, p.x, p.y, (b) => b !== p.owner && b.tag !== 'pickup');

      if (hit) {
        onHit(p, hit);
        this.list.splice(i, 1);
        continue;
      }
      if (p.life <= 0) {
        onHit(p, null);
        this.list.splice(i, 1);
      }
    }
  }

  clear() { this.list.length = 0; }
}


// ===== src/game/actuation.js =====
/**
 * An Intent is the entire vocabulary a controller has. The player's keyboard
 * and an enemy's behaviour tree both produce one of these and nothing else,
 * so every machine in the world is actuated by exactly the same code. An AI
 * that loses its thrusters handles badly for the same physical reason a player
 * does -- there is no separate "enemy movement" to keep in sync.
 */
function makeIntent() {
  return {
    move: { x: 0, y: 0 },   // desired world-space travel direction (length 0..1)
    aim: { x: 0, y: 0 },    // world point to face
    fire: false,
    altFire: false,
    dash: false,
    brake: false,
  };
}

const TORQUE_GAIN = 7.5;
const MAX_TURN_RATE = 9;

/**
 * Drive one body for one step from its intent. Returns a small report used by
 * audio and FX (how hard the engines are working, whether anything fired).
 */
function actuate(body, dt, ctx) {
  const intent = body.intent;
  const report = { thrust: 0, wheel: 0, fired: 0, brownout: 0 };
  if (!intent || body.parts.length === 0) return report;

  // --- energy budget ------------------------------------------------------
  let supply = 0;
  for (const p of body.parts) if (p.def.energy > 0) supply += p.def.energy;
  // Recharge at exactly the supply rate: cores and batteries are the sustained
  // budget, the stored charge is only a burst reserve on top of it.
  body.energy = Math.min(body.energyMax, body.energy + supply * dt);

  const moveMag = Math.hypot(intent.move.x, intent.move.y);
  const mx = moveMag > 0.001 ? intent.move.x / moveMag : 0;
  const my = moveMag > 0.001 ? intent.move.y / moveMag : 0;
  const throttle = clamp(moveMag, 0, 1);

  // --- rotation target ----------------------------------------------------
  const aimDx = intent.aim.x - body.pos.x;
  const aimDy = intent.aim.y - body.pos.y;
  let angErr = 0;
  if (aimDx * aimDx + aimDy * aimDy > 4) {
    angErr = angleDiff(body.angle, Math.atan2(aimDy, aimDx));
  }
  // PD controller: what angular acceleration would we like right now?
  const desiredAngVel = clamp(angErr * TORQUE_GAIN, -MAX_TURN_RATE, MAX_TURN_RATE);
  const angDemand = clamp((desiredAngVel - body.angVel) * 0.5, -1, 1);

  // --- pass 1: work out what each actuator wants and what it would cost ---
  let demand = 0;
  const plan = [];
  for (const p of body.parts) {
    const kind = p.def.kind;
    if (kind !== 'thruster' && kind !== 'cannon' && kind !== 'floatcore' && kind !== 'wheel') {
      p.activation *= 0.85;
      continue;
    }

    if (kind === 'thruster') {
      const dir = fromAngle(body.angle + p.angle);
      const linear = (dir.x * mx + dir.y * my) * throttle;
      // Torque this thruster would generate, in body units: r x f.
      const c = Math.cos(body.angle), s = Math.sin(body.angle);
      const rx = p.pos.x * c - p.pos.y * s;
      const ry = p.pos.x * s + p.pos.y * c;
      const torqueSign = rx * dir.y - ry * dir.x;
      const rotational = clamp(torqueSign * angDemand * 0.02, -1, 1);
      // A thruster cannot pull, only push -- so activation floors at zero.
      const act = clamp(linear + rotational * 0.9, 0, 1);
      if (act > 0.01) {
        const cost = -p.def.energy * act;
        demand += cost;
        plan.push({ part: p, kind, act, cost, dir });
      } else {
        p.activation *= 0.8;
      }
      continue;
    }

    if (kind === 'wheel') {
      // Wheels need something to push against. Over a chasm they freewheel.
      if (!body.grounded) { p.activation *= 0.8; continue; }
      const dir = fromAngle(body.angle + p.angle);
      const act = clamp((dir.x * mx + dir.y * my) * throttle, -1, 1);
      const cost = -p.def.energy * Math.abs(act);
      demand += cost;
      plan.push({ part: p, kind, act, cost, dir });
      continue;
    }

    if (kind === 'floatcore') {
      const cost = -p.def.energy;
      demand += cost;
      plan.push({ part: p, kind, act: 1, cost, dir: null });
      continue;
    }

    if (kind === 'cannon') {
      p.cooldown -= dt;
      const wantsFire = p.def.projectile === 'shell' ? intent.altFire : intent.fire;
      if (wantsFire && p.cooldown <= 0) {
        // A shot is a lump cost against stored energy, not a continuous draw,
        // so it is deliberately kept out of the rate-based demand total below.
        plan.push({ part: p, kind, act: 1, lump: -p.def.energy, dir: fromAngle(body.angle + p.angle) });
      }
    }
  }

  // --- energy rationing ---------------------------------------------------
  // Over-build your thrusters and the whole machine browns out. This is a
  // deliberate design pressure, not a failure: it forces real build tradeoffs.
  //
  // `body.energy` already had this frame's supply added to it above, so the
  // spendable rate is purely the stored charge over the timestep -- adding
  // `supply` again here would double-count it and let a drained chassis draw
  // twice what its cores actually produce.
  const available = body.energy / Math.max(dt, 1e-4);
  const scale = demand > available ? clamp(available / demand, 0, 1) : 1;
  report.brownout = 1 - scale;
  report.demand = demand;
  report.supply = supply;
  body.energy = Math.max(0, body.energy - demand * scale * dt);

  // --- pass 2: apply ------------------------------------------------------
  let hover = false;
  for (const item of plan) {
    const p = item.part;

    if (item.kind === 'thruster') {
      const act = item.act * scale;
      p.activation = act;
      report.thrust = Math.max(report.thrust, act);
      const f = p.def.force * act;
      body.applyForce(item.dir.x * f, item.dir.y * f, p.wpos.x, p.wpos.y);
      if (act > 0.15 && ctx.particles) {
        ctx.particles.thrusterPlume(p, item.dir, act, dt);
      }
      continue;
    }

    if (item.kind === 'wheel') {
      const act = item.act * scale;
      p.activation = Math.abs(act);
      report.wheel = Math.max(report.wheel, Math.abs(act));
      const f = p.def.force * act;
      body.applyForce(item.dir.x * f, item.dir.y * f, p.wpos.x, p.wpos.y);

      // Lateral grip: resist sideways slide at the contact point. This is what
      // makes wheeled builds corner instead of skating, and what lets a heavy
      // build drift when you overpower the tyres.
      const pv = body.pointVel(p.wpos.x, p.wpos.y);
      const latX = -item.dir.y, latY = item.dir.x;
      const vLat = pv.x * latX + pv.y * latY;
      const grip = p.def.grip * p.mass * 60;
      const fx = -latX * vLat * grip, fy = -latY * vLat * grip;
      body.applyForce(clamp(fx, -18000, 18000), clamp(fy, -18000, 18000), p.wpos.x, p.wpos.y);
      continue;
    }

    if (item.kind === 'floatcore') {
      if (scale > 0.5) { hover = true; p.activation = 1; }
      else p.activation = 0.2;
      continue;
    }

    if (item.kind === 'cannon') {
      // Firing is charged as a lump so a rapid cannon drains a small battery.
      if (body.energy < item.lump * 0.5) { p.cooldown = 0.12; continue; }
      body.energy = Math.max(0, body.energy - item.lump);
      p.cooldown = p.def.fireRate;
      p.heat = 1;
      const muzzleDist = p.def.extents.x + 8;
      const ox = p.wpos.x + item.dir.x * muzzleDist;
      const oy = p.wpos.y + item.dir.y * muzzleDist;
      ctx.spawnProjectile({
        type: p.def.projectile,
        x: ox, y: oy,
        dir: item.dir,
        owner: body,
        team: body.team,
        part: p,
      });
      // Real recoil: applied at the barrel, so a badly braced cannon spins you.
      body.applyImpulse(-item.dir.x * p.def.recoil, -item.dir.y * p.def.recoil, p.wpos.x, p.wpos.y);
      report.fired++;
      continue;
    }
  }

  body.hover = hover;

  // Blades charge up while the trigger is held; a hot blade hits much harder.
  for (const p of body.parts) {
    if (p.def.kind === 'blade') {
      const want = intent.fire ? 1 : 0;
      p.heat += (want - p.heat) * Math.min(1, dt * 6);
    } else if (p.def.kind === 'cannon') {
      p.heat *= Math.exp(-dt * 5);
    }
    if (p.flash > 0) p.flash = Math.max(0, p.flash - dt * 3.2);
  }

  if (intent.brake) {
    body.vel.x -= body.vel.x * Math.min(1, dt * 5);
    body.vel.y -= body.vel.y * Math.min(1, dt * 5);
    body.angVel -= body.angVel * Math.min(1, dt * 8);
  }

  return report;
}

/** Shared dash: a burst impulse toward a direction, with brief invulnerability. */
function dash(body, dirX, dirY, power = 1) {
  const l = Math.hypot(dirX, dirY) || 1;
  const j = 520 * body.mass * power;
  body.applyImpulse((dirX / l) * j, (dirY / l) * j);
  body.invuln = Math.max(body.invuln, 0.22);
  return true;
}


// ===== src/ai/behaviortree.js =====
// A tiny behaviour tree. Nodes are plain objects with a tick(bb, dt) method
// returning one of three statuses. Trees are instantiated per agent so that
// stateful nodes (cooldowns, running sequences) never leak between enemies.

const SUCCESS = 'success';
const FAILURE = 'failure';
const RUNNING = 'running';

/**
 * Reactive sequence: re-evaluates every child from the start on each tick, so
 * guard conditions keep being checked while a later child is still running.
 * This matters -- a "chase the player" action must stop the instant the
 * "player exists and is visible" condition in front of it stops holding.
 */
function sequence(...children) {
  return {
    kind: 'sequence',
    tick(bb, dt) {
      for (let i = 0; i < children.length; i++) {
        const status = children[i].tick(bb, dt);
        if (status === RUNNING) return RUNNING;
        if (status === FAILURE) return FAILURE;
      }
      return SUCCESS;
    },
  };
}

/** Run children in order; stop at the first that succeeds or is running. */
function selector(...children) {
  return {
    kind: 'selector',
    tick(bb, dt) {
      for (const child of children) {
        const status = child.tick(bb, dt);
        if (status !== FAILURE) return status;
      }
      return FAILURE;
    },
  };
}

/** Leaf that passes when the predicate is true. */
function condition(name, fn) {
  return { kind: 'condition', name, tick: (bb) => (fn(bb) ? SUCCESS : FAILURE) };
}

/**
 * Leaf that does something. The function may return a status; returning
 * undefined is treated as RUNNING, which is the common case for steering.
 */
function action(name, fn) {
  return {
    kind: 'action', name,
    tick(bb, dt) {
      bb.activeAction = name;
      const r = fn(bb, dt);
      return r === undefined ? RUNNING : r;
    },
  };
}

function invert(child) {
  return {
    kind: 'invert',
    tick(bb, dt) {
      const s = child.tick(bb, dt);
      if (s === SUCCESS) return FAILURE;
      if (s === FAILURE) return SUCCESS;
      return RUNNING;
    },
  };
}

/** Gate a subtree behind a recharge timer. */
function cooldown(seconds, child) {
  return {
    kind: 'cooldown',
    timer: Math.random() * seconds,
    tick(bb, dt) {
      this.timer -= dt;
      if (this.timer > 0) return FAILURE;
      const s = child.tick(bb, dt);
      if (s === SUCCESS || s === FAILURE) this.timer = seconds;
      return s;
    },
  };
}

/** Keep ticking a subtree for a fixed duration once entered. */
function commit(seconds, child) {
  return {
    kind: 'commit',
    remaining: 0,
    active: false,
    tick(bb, dt) {
      if (!this.active) { this.active = true; this.remaining = seconds; }
      this.remaining -= dt;
      const s = child.tick(bb, dt);
      if (this.remaining <= 0 || s === FAILURE) {
        this.active = false;
        return s === FAILURE ? FAILURE : SUCCESS;
      }
      return RUNNING;
    },
  };
}

function always(status, child) {
  return { kind: 'always', tick(bb, dt) { child.tick(bb, dt); return status; } };
}


// ===== src/ai/enemy.js =====
const BOLT_SPEED = 1750;

/**
 * Enemy AI. The tree produces nothing but an Intent -- the same struct the
 * player's keyboard produces -- so an enemy that loses a thruster genuinely
 * handles worse, and a Bruiser that shoves a boulder is using the same physics
 * the player would. There is no cheating movement and no scripted damage.
 *
 * States follow the design: Patrol -> Detect -> Charge/Flank -> Special ->
 * Fall back on structural loss.
 */
class EnemyController {
  constructor(body, spec, ctx) {
    this.body = body;
    this.spec = spec;
    this.ai = spec.ai;
    this.ctx = ctx;             // { game, physics, worldgen, bus, projectiles }
    this.intent = makeIntent();
    body.intent = this.intent;

    this.aware = false;
    this.alertTimer = 0;
    this.patrolTarget = null;
    this.patrolTimer = 0;
    this.strafeDir = Math.random() < 0.5 ? 1 : -1;
    this.strafeTimer = 0;
    this.state = 'patrol';
    this.lastKnown = null;
    this.tree = this.buildTree();
  }

  buildTree() {
    return selector(
      // --- fall back when the chassis is coming apart ---------------------
      sequence(
        condition('crippled', (bb) => bb.self.integrity < bb.ai.fleeIntegrity),
        action('flee', (bb, dt) => this.doFlee(bb, dt)),
      ),

      // --- engaged --------------------------------------------------------
      sequence(
        condition('hasTarget', (bb) => !!bb.target),
        condition('detected', (bb) => this.doDetect(bb)),
        selector(
          // Signature move, on a recharge. Bruisers hurl scenery, the boss
          // opens up with everything it still has bolted on.
          cooldown(this.ai.salvo ? 6.5 : 5.0,
            commit(this.ai.salvo ? 2.2 : 0.9,
              action('special', (bb, dt) => this.doSpecial(bb, dt)))),
          // Too far: close the gap.
          sequence(
            condition('tooFar', (bb) => bb.dist > bb.ai.engageRange),
            action('charge', (bb, dt) => this.doCharge(bb, dt)),
          ),
          // In range: circle and shoot.
          action('flank', (bb, dt) => this.doFlank(bb, dt)),
        ),
      ),

      // --- nothing to do --------------------------------------------------
      action('patrol', (bb, dt) => this.doPatrol(bb, dt)),
    );
  }

  update(dt) {
    const body = this.body;
    const target = this.ctx.game.player && !this.ctx.game.player.dead ? this.ctx.game.player : null;

    const bb = {
      self: body,
      ai: this.ai,
      target,
      dist: target ? Math.hypot(target.pos.x - body.pos.x, target.pos.y - body.pos.y) : Infinity,
      dt,
    };

    // Reset the intent every tick; whatever the tree writes is the whole order.
    this.intent.move.x = 0;
    this.intent.move.y = 0;
    this.intent.fire = false;
    this.intent.altFire = false;
    this.intent.dash = false;
    this.intent.brake = false;
    this.intent.aim.x = body.pos.x + Math.cos(body.angle) * 100;
    this.intent.aim.y = body.pos.y + Math.sin(body.angle) * 100;

    this.tree.tick(bb, dt);
    this.state = bb.activeAction || 'idle';

    // Nothing steers into a chasm on purpose. Any machine without a float core
    // checks the ground ahead and veers off.
    this.avoidVoid(dt);
  }

  // --- perception ---------------------------------------------------------

  doDetect(bb) {
    if (!bb.target) return false;
    if (bb.dist > bb.ai.sightRange) {
      if (this.aware) { this.aware = false; this.lastKnown = null; }
      return false;
    }
    // Line of sight: a boulder or hull between us breaks the lock, which is
    // what makes cover matter.
    const hit = this.ctx.physics.raycast(
      this.body.pos.x, this.body.pos.y, bb.target.pos.x, bb.target.pos.y,
      (b) => b !== this.body && b !== bb.target && b.tag !== 'pickup' && b.tag !== 'debris',
    );
    const visible = !hit;

    if (visible) {
      this.lastKnown = { x: bb.target.pos.x, y: bb.target.pos.y };
      if (!this.aware) {
        this.aware = true;
        this.alertTimer = 0.35;   // brief reaction delay before it commits
        this.ctx.bus.emit('enemy:alert', { body: this.body, spec: this.spec });
      }
    }
    if (this.alertTimer > 0) {
      this.alertTimer -= bb.dt;
      this.faceToward(bb.target.pos.x, bb.target.pos.y);
      return false;
    }
    return this.aware;
  }

  /** Predictive aim: lead the shot by the target's own velocity. */
  aimAt(target, projectileSpeed = BOLT_SPEED) {
    if (!target || target.dead) return;
    const dx = target.pos.x - this.body.pos.x;
    const dy = target.pos.y - this.body.pos.y;
    const d = Math.hypot(dx, dy);
    const t = clamp(d / projectileSpeed, 0, 0.7);
    this.intent.aim.x = target.pos.x + target.vel.x * t;
    this.intent.aim.y = target.pos.y + target.vel.y * t;
  }

  faceToward(x, y) {
    this.intent.aim.x = x;
    this.intent.aim.y = y;
  }

  moveToward(x, y, throttle = 1) {
    const dx = x - this.body.pos.x, dy = y - this.body.pos.y;
    const d = Math.hypot(dx, dy) || 1;
    this.intent.move.x = (dx / d) * throttle;
    this.intent.move.y = (dy / d) * throttle;
  }

  // --- behaviours ---------------------------------------------------------

  doPatrol(bb, dt) {
    this.patrolTimer -= dt;
    if (!this.patrolTarget || this.patrolTimer <= 0) {
      // Wander to somewhere that actually has ground under it.
      for (let tries = 0; tries < 6; tries++) {
        const a = Math.random() * Math.PI * 2;
        const r = 260 + Math.random() * 520;
        const x = this.body.pos.x + Math.cos(a) * r;
        const y = this.body.pos.y + Math.sin(a) * r;
        if (this.ctx.worldgen.isSolid(x, y) || this.body.hasKind('floatcore')) {
          this.patrolTarget = { x, y };
          break;
        }
      }
      this.patrolTimer = 3 + Math.random() * 3;
    }
    if (this.patrolTarget) {
      const d = Math.hypot(this.patrolTarget.x - this.body.pos.x, this.patrolTarget.y - this.body.pos.y);
      if (d < 70) { this.patrolTarget = null; this.patrolTimer = 0; return SUCCESS; }
      this.moveToward(this.patrolTarget.x, this.patrolTarget.y, 0.45 * this.ai.speed);
      this.faceToward(this.patrolTarget.x, this.patrolTarget.y);
    }
    return RUNNING;
  }

  doCharge(bb, dt) {
    const t = bb.target;
    if (!t) return FAILURE;
    this.aimAt(t);
    // Aim slightly off-axis so a pack does not collapse into a single line.
    const ang = angleOf({ x: t.pos.x - this.body.pos.x, y: t.pos.y - this.body.pos.y });
    const off = this.ai.flankBias * this.strafeDir * 0.5;
    const dir = fromAngle(ang + off);
    this.intent.move.x = dir.x * this.ai.speed;
    this.intent.move.y = dir.y * this.ai.speed;

    // Ranged units keep firing while they close.
    if (bb.dist < this.ai.sightRange * 0.8 && this.body.hasKind('cannon')) {
      this.intent.fire = Math.sin(this.ctx.game.time * 7 + this.body.id) > -0.2;
    }
    // Melee builds commit with a burst once they are nearly on top of you.
    if (bb.dist < 240 && this.body.hasKind('blade') && Math.random() < dt * 1.4) {
      dash(this.body, t.pos.x - this.body.pos.x, t.pos.y - this.body.pos.y, 0.7);
      this.ctx.bus.emit('sfx:dash', { x: this.body.pos.x, y: this.body.pos.y });
    }
    return bb.dist <= this.ai.engageRange ? SUCCESS : RUNNING;
  }

  doFlank(bb, dt) {
    const t = bb.target;
    if (!t) return FAILURE;
    this.aimAt(t);
    this.intent.fire = true;

    this.strafeTimer -= dt;
    if (this.strafeTimer <= 0) {
      this.strafeDir *= -1;
      this.strafeTimer = 1.4 + Math.random() * 1.8;
    }

    // Hold the preferred range: push in when too far, back off when too close,
    // and orbit the rest of the time.
    const dx = t.pos.x - this.body.pos.x, dy = t.pos.y - this.body.pos.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;
    const radial = clamp((d - this.ai.preferredRange) / 160, -1, 1);
    const tx = -ny * this.strafeDir, ty = nx * this.strafeDir;
    const orbit = 1 - Math.abs(radial) * 0.6;

    this.intent.move.x = (nx * radial + tx * orbit) * this.ai.speed;
    this.intent.move.y = (ny * radial + ty * orbit) * this.ai.speed;

    // Blades want contact; keep pressing rather than orbiting at a distance.
    if (this.body.hasKind('blade') && d > 90) {
      this.intent.move.x = nx * this.ai.speed;
      this.intent.move.y = ny * this.ai.speed;
    }
    return RUNNING;
  }

  /**
   * Special attacks are physics, not animation. A Bruiser finds a real boulder
   * lying nearby and throws it -- if it misses you it may well flatten one of
   * its own allies, or knock a chunk out of a cliff.
   */
  doSpecial(bb, dt) {
    const t = bb.target;
    if (!t) return FAILURE;
    this.aimAt(t);

    if (this.ai.salvo) {
      // Boss: dump everything downrange while advancing.
      this.intent.fire = true;
      this.intent.altFire = Math.sin(this.ctx.game.time * 3) > 0.4;
      this.moveToward(t.pos.x, t.pos.y, 0.6 * this.ai.speed);
      return RUNNING;
    }

    if (this.ai.throwsBoulders) {
      if (!this.throwState) {
        const rock = this.findBoulder();
        if (!rock) return FAILURE;
        this.throwState = { rock, wind: 0.45 };
        this.ctx.bus.emit('sfx:charge', { x: this.body.pos.x, y: this.body.pos.y });
      }
      const st = this.throwState;
      st.wind -= dt;
      this.intent.brake = true;

      if (st.rock.dead || st.rock.parts.length === 0) { this.throwState = null; return FAILURE; }

      // Wind-up: drag the rock in close so the throw reads before it lands.
      const dx = this.body.pos.x - st.rock.pos.x, dy = this.body.pos.y - st.rock.pos.y;
      const d = Math.hypot(dx, dy) || 1;
      const pull = st.rock.mass * 260;
      st.rock.applyForce((dx / d) * pull, (dy / d) * pull);
      st.rock.touched = true;

      if (st.wind <= 0) {
        const ax = this.intent.aim.x - st.rock.pos.x;
        const ay = this.intent.aim.y - st.rock.pos.y;
        const ad = Math.hypot(ax, ay) || 1;
        const power = st.rock.mass * 1250;
        st.rock.applyImpulse((ax / ad) * power, (ay / ad) * power);
        st.rock.angVel += (Math.random() - 0.5) * 12;
        st.rock.thrownBy = this.body;
        this.ctx.bus.emit('sfx:throw', { x: this.body.pos.x, y: this.body.pos.y });
        this.throwState = null;
        return SUCCESS;
      }
      return RUNNING;
    }

    // Default special: a hard closing dash with the trigger down.
    this.intent.fire = true;
    this.moveToward(t.pos.x, t.pos.y, this.ai.speed);
    if (!this.dashed) {
      dash(this.body, t.pos.x - this.body.pos.x, t.pos.y - this.body.pos.y, 0.9);
      this.dashed = true;
      this.ctx.bus.emit('sfx:dash', { x: this.body.pos.x, y: this.body.pos.y });
      return SUCCESS;
    }
    this.dashed = false;
    return SUCCESS;
  }

  doFlee(bb, dt) {
    const t = bb.target;
